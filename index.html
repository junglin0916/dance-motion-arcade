<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Motion Dance Arcade</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        .mirror {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Section -->
    <header class="text-center mb-4">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">
            AI Just-Dance Arcade
        </h1>
        <p class="text-slate-400 mt-1">Match the pose on screen to score points!</p>
    </header>

    <!-- Main Game Box -->
    <main class="relative w-full max-w-4xl bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 aspect-video">
        
        <!-- 1. YouTube Reference Video Background (Iframe Embed) -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <iframe id="yt-player" 
                    class="w-full h-full scale-125" 
                    src="https://www.youtube.com/embed/fJ9rUzIMcZQ?enablejsapi=1&autoplay=0&controls=0&mute=1&loop=1" 
                    frameborder="0" 
                    allow="autoplay">
            </iframe>
        </div>

        <!-- 2. Player Webcam Overlay (Mirrored + Semi-transparent) -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror opacity-40 pointer-events-none" playsinline></video>

        <!-- 3. Canvas for Skeleton Tracking & Visual Effects -->
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover mirror pointer-events-none"></canvas>

        <!-- Dynamic Success Feedback Indicator -->
        <div id="hit-feedback" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200 z-20">
            <span class="text-6xl font-black text-yellow-300 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] animate-bounce">
                PERFECT! +10
            </span>
        </div>

        <!-- Heads Up Display (HUD) -->
        <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block">Score</span>
                <span id="score-display" class="text-3xl font-black text-yellow-400">0</span>
            </div>
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700 px-6 py-2 rounded-xl text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block">Target Move</span>
                <span id="pose-display" class="text-2xl font-black text-emerald-400 animate-pulse">Raise BOTH Hands!</span>
            </div>
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl text-center">
                <span class="text-xs uppercase tracking-wider text-slate-400 block">Time</span>
                <span id="timer-display" class="text-3xl font-black text-rose-400">30s</span>
            </div>
        </div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="absolute inset-0 bg-slate-900/90 backdrop-blur flex flex-col items-center justify-center p-6 z-30">
            <h2 class="text-3xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">Ready to Dance?</h2>
            <input type="text" id="player-name" placeholder="Enter Player Name" class="px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl mb-4 text-center focus:outline-none focus:border-purple-500 w-64 text-white">
            <button id="start-btn" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white text-lg font-bold rounded-xl transition shadow-lg transform active:scale-95">
                Start Game
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="end-overlay" class="absolute inset-0 bg-slate-900/95 backdrop-blur flex flex-col items-center justify-center p-6 z-30 hidden">
            <h2 class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-500">Stage Complete!</h2>
            <p id="final-stats" class="text-lg text-slate-300 mb-2"></p>
            <p id="prize-stats" class="text-md text-emerald-400 font-semibold mb-6"></p>
            <div id="sheet-status" class="text-xs text-slate-400 mb-6 italic">Logging score to Google Sheet...</div>
            <button id="restart-btn" class="px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition shadow-lg">
                Play Again
            </button>
        </div>

    </main>

    <script>
        // ==========================================
        // CONFIGURATION & GOOGLE SHEET
        // ==========================================
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcQZEVrNZq6uWqATZvUeCW0qkXHmFq0n5EhvwPFsjkxvEDEW__VWXtWQuvM2sFqn361Q/exec";

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let isGameActive = false;
        let lastScoreTime = 0; // Cooldown timer to prevent scoring 100 times per second

        const poseList = [
            { name: "Hands Up!", check: (l) => l[15].y < l[11].y && l[16].y < l[12].y },
            { name: "Left Arm Up!", check: (l) => l[15].y < l[11].y && l[16].y > l[12].y },
            { name: "Right Arm Up!", check: (l) => l[16].y < l[12].y && l[15].y > l[11].y },
            { name: "T-Pose Arms Out!", check: (l) => Math.abs(l[15].y - l[11].y) < 0.15 && Math.abs(l[16].y - l[12].y) < 0.15 }
        ];

        let currentPoseIndex = 0;

        // DOM Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const poseDisplay = document.getElementById('pose-display');
        const startOverlay = document.getElementById('start-overlay');
        const endOverlay = document.getElementById('end-overlay');
        const hitFeedback = document.getElementById('hit-feedback');

        // MediaPipe Pose Setup
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();

        function resizeCanvas() {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
        }

        function onResults(results) {
            resizeCanvas();
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isGameActive) {
                // Draw skeleton joints on player
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FFFF', lineWidth: 4 });
                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF007F', lineWidth: 2 });

                // Check Pose Match with 800ms cooldown
                const now = Date.now();
                if (now - lastScoreTime > 800) {
                    const activePose = poseList[currentPoseIndex];
                    if (activePose.check(results.poseLandmarks)) {
                        score += 10;
                        scoreDisplay.textContent = score;
                        lastScoreTime = now;

                        // Visual Hit FX
                        hitFeedback.classList.remove('opacity-0');
                        setTimeout(() => hitFeedback.classList.add('opacity-0'), 400);

                        // Pick next target pose
                        currentPoseIndex = (currentPoseIndex + 1) % poseList.length;
                        poseDisplay.textContent = poseList[currentPoseIndex].name;
                    }
                }
            }
            canvasCtx.restore();
        }

        // Control YouTube Video via postMessage API
        function controlYouTube(action) {
            const iframe = document.getElementById('yt-player').contentWindow;
            const func = action === 'play' ? 'playVideo' : 'pauseVideo';
            iframe.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
        }

        function startGame() {
            const playerName = document.getElementById('player-name').value.trim() || "Anonymous";
            score = 0;
            timeLeft = 30;
            isGameActive = true;
            currentPoseIndex = 0;

            scoreDisplay.textContent = score;
            timerDisplay.textContent = `${timeLeft}s`;
            poseDisplay.textContent = poseList[currentPoseIndex].name;

            startOverlay.classList.add('hidden');
            endOverlay.classList.add('hidden');

            controlYouTube('play');

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame(playerName);
                }
            }, 1000);
        }

        async function endGame(playerName) {
            clearInterval(gameInterval);
            isGameActive = false;

            controlYouTube('pause');

            const prizesWon = Math.floor(score / 50);
            const gameResult = score >= 100 ? "Winner" : "Completed";

            document.getElementById('final-stats').textContent = `Player: ${playerName} | Score: ${score}`;
            document.getElementById('prize-stats').textContent = `Prizes Earned: ${prizesWon}`;
            
            endOverlay.classList.remove('hidden');

            await sendScoreToGoogleSheet(playerName, score, prizesWon, gameResult);
        }

        async function sendScoreToGoogleSheet(pName, pScore, pPrizes, pResult) {
            const payload = { playerName: pName, score: pScore, prizes: pPrizes, result: pResult };
            try {
                await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                document.getElementById('sheet-status').textContent = "Score successfully logged to Google Sheet!";
            } catch (error) {
                document.getElementById('sheet-status').textContent = "Failed to log score to Google Sheet.";
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dance Arcade - ml5 PoseNet</title>
    <!-- p5.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.sound.min.js"></script>
    <!-- ml5.js Library -->
    <script src="https://unpkg.com/ml5@0.4.2/dist/ml5.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 28px;
            color: #ec4899;
        }

        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* YouTube Background */
        #yt-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* p5 Canvas Overlay */
        #defaultCanvas0 {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* UI Score Banner */
        #ui-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 3;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
        }

        .hud-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 20px;
            font-weight: bold;
            color: #facc15;
        }

        /* Hit Popup FX */
        #hit-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 10px #000;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            z-index: 4;
            pointer-events: none;
        }

        /* Overlays (Start & End) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            width: 200px;
        }

        button {
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>AI Dance Arcade</h1>
    <p style="color: #94a3b8; margin-top: 0;">Perform the requested moves to score points!</p>

    <div id="game-container">
        <!-- YouTube Background Video -->
        <iframe id="yt-bg" 
                src="https://www.youtube.com/embed/kpZhZAr1cQU?enablejsapi=1&autoplay=0&controls=0&mute=1&loop=1" 
                frameborder="0" 
                allow="autoplay">
        </iframe>

        <!-- HUD Interface -->
        <div id="ui-bar">
            <div class="hud-card">
                <div class="hud-title">Score</div>
                <div id="score" class="hud-value">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Target Move</div>
                <div id="pose-target" class="hud-value" style="color: #34d399;">GET READY</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Time</div>
                <div id="timer" class="hud-value" style="color: #f43f5e;">180s</div>
            </div>
        </div>

        <div id="hit-popup">PERFECT! +10</div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="overlay">
            <h2 style="color: #ec4899; margin-bottom: 10px;">Ready to Dance?</h2>
            <input type="text" id="player-name" placeholder="Enter Player Name">
            <button onclick="startGame()">Start 3-Min Game</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="end-overlay" class="overlay hidden">
            <h2 style="color: #facc15; margin-bottom: 10px;">Stage Complete!</h2>
            <p id="final-stats" style="font-size: 18px; margin-bottom: 5px;"></p>
            <p id="prize-stats" style="color: #34d399; font-weight: bold; margin-bottom: 20px;"></p>
            <div id="sheet-status" style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Logging score to Google Sheet...</div>
            <button onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcQZEVrNZq6uWqATZvUeCW0qkXHmFq0n5EhvwPFsjkxvEDEW__VWXtWQuvM2sFqn361Q/exec";

        let video;
        let poseNet;
        let poses = [];
        let score = 0;
        let timeLeft = 180; // 3 Minutes Timer (180 seconds)
        let gameInterval = null;
        let isGameActive = false;
        let lastScoreTime = 0;
        let playerName = "Anonymous";

        // Action moves array
        const moves = [
            { 
                name: "BOTH HANDS UP!", 
                check: (lw, rw, ls, rs) => (lw.y < min(ls.y, rs.y)) && (rw.y < min(ls.y, rs.y)) 
            },
            { 
                name: "LEFT ARM UP!", 
                check: (lw, rw, ls, rs) => (lw.y < min(ls.y, rs.y)) && (rw.y > min(ls.y, rs.y)) 
            },
            { 
                name: "RIGHT ARM UP!", 
                check: (lw, rw, ls, rs) => (rw.y < min(ls.y, rs.y)) && (lw.y > min(ls.y, rs.y)) 
            },
            { 
                name: "T-POSE (ARMS OUT)!", 
                check: (lw, rw, ls, rs) => Math.abs(lw.y - ls.y) < 40 && Math.abs(rw.y - rs.y) < 40 
            }
        ];

        let currentMoveIndex = 0;

        function setup() {
            let canvas = createCanvas(640, 480);
            canvas.parent('game-container');

            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide();

            poseNet = ml5.poseNet(video, modelReady);
            poseNet.on('pose', function(results) {
                poses = results;
            });
        }

        function modelReady() {
            console.log("ml5 PoseNet Ready");
        }

        function draw() {
            clear();

            push();
            translate(width, 0);
            scale(-1, 1);
            tint(255, 130);
            image(video, 0, 0, width, height);

            if (poses.length > 0 && isGameActive) {
                let pose = poses[0].pose;
                for (let i = 0; i < pose.keypoints.length; i++) {
                    let keypoint = pose.keypoints[i];
                    if (keypoint.score > 0.1) {
                        fill(255, 0, 100);
                        noStroke();
                        ellipse(keypoint.position.x, keypoint.position.y, 10, 10);
                    }
                }
            }
            pop();

            if (isGameActive) {
                checkScoring();
            }
        }

        function checkScoring() {
            if (poses.length > 0) {
                let pose = poses[0].pose;
                let lw = pose.leftWrist;
                let rw = pose.rightWrist;
                let ls = pose.leftShoulder;
                let rs = pose.rightShoulder;

                if (ls.confidence > 0.1 || rs.confidence > 0.1) {
                    const activeMove = moves[currentMoveIndex];

                    if (activeMove.check(lw, rw, ls, rs)) {
                        let now = millis();
                        if (now - lastScoreTime > 600) { // Cooldown between poses
                            score += 10;
                            document.getElementById('score').innerText = score;
                            lastScoreTime = now;

                            // Show PERFECT animation
                            let popup = document.getElementById('hit-popup');
                            popup.style.opacity = '1';
                            setTimeout(() => { popup.style.opacity = '0'; }, 300);

                            // Cycle to next random action move
                            currentMoveIndex = (currentMoveIndex + 1) % moves.length;
                            document.getElementById('pose-target').innerText = moves[currentMoveIndex].name;
                        }
                    }
                }
            }
        }

        function controlYouTube(action) {
            const iframe = document.getElementById('yt-bg').contentWindow;
            const func = action === 'play' ? 'playVideo' : 'pauseVideo';
            iframe.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
        }

        function startGame() {
            const inputVal = document.getElementById('player-name').value.trim();
            playerName = inputVal || "Anonymous";
            score = 0;
            timeLeft = 180; // 3 minutes timer
            isGameActive = true;
            currentMoveIndex = 0;

            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = `${timeLeft}s`;
            document.getElementById('pose-target').innerText = moves[currentMoveIndex].name;

            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('end-overlay').classList.add('hidden');

            controlYouTube('play');

            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        async function endGame() {
            clearInterval(gameInterval);
            isGameActive = false;

            controlYouTube('pause');

            const prizesWon = Math.floor(score / 50);
            const gameResult = score >= 100 ? "Winner" : "Completed";

            document.getElementById('final-stats').innerText = `Player: ${playerName} | Score: ${score}`;
            document.getElementById('prize-stats').innerText = `Prizes Earned: ${prizesWon}`;
            document.getElementById('sheet-status').innerText = "Logging score to Google Sheet...";

            document.getElementById('end-overlay').classList.remove('hidden');

            await sendScoreToGoogleSheet(playerName, score, prizesWon, gameResult);
        }

        async function sendScoreToGoogleSheet(pName, pScore, pPrizes, pResult) {
            const payload = { playerName: pName, score: pScore, prizes: pPrizes, result: pResult };
            try {
                await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                document.getElementById('sheet-status').innerText = "Score successfully logged to Google Sheet!";
            } catch (error) {
                document.getElementById('sheet-status').innerText = "Failed to log score to Google Sheet.";
            }
        }
    </script>
</body>
</html>

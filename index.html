<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dance Arcade - ml5 PoseNet Duet</title>

<!-- p5.js Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.sound.min.js"></script>
<!-- ml5.js Library -->
<script src="https://unpkg.com/ml5@0.4.2/dist/ml5.min.js"></script>

<style>
body {
    margin: 0; padding: 0;
    background-color: #0f172a; color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
}
h1 { margin: 10px 0 5px 0; font-size: 28px; color: #ec4899; }

#game-container {
    position: relative; width: 640px; height: 480px;
    border: 4px solid #3b82f6; border-radius: 12px;
    overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

#yt-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
#defaultCanvas0 { position: absolute; top: 0; left: 0; z-index: 2; }

#ui-bar {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; z-index: 3;
    pointer-events: none; gap: 8px;
}

.hud-card {
    background: rgba(15, 23, 42, 0.85); border: 1px solid #475569;
    padding: 6px 12px; border-radius: 8px; text-align: center; min-width: 92px;
}
.hud-card.player1 { border-color: #34d399; }
.hud-card.player2 { border-color: #f472b6; }
.hud-card.leader { box-shadow: 0 0 10px 2px #facc15; }

.hud-title { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
.hud-name { font-size: 11px; font-weight: bold; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.hud-value { font-size: 22px; font-weight: bold; color: #facc15; }

#center-hud { text-align: center; }
#timer { font-size: 18px; font-weight: bold; color: #f43f5e; }
#pose-target { font-size: 15px; font-weight: bold; color: #34d399; }

.hit-popup {
    position: absolute; top: 40%; font-size: 30px; font-weight: 900;
    text-shadow: 0 0 12px #000; opacity: 0; transition: opacity 0.15s ease-in-out;
    z-index: 4; pointer-events: none;
}
#hit-popup-1 { left: 25%; transform: translate(-50%, -50%); color: #34d399; }
#hit-popup-2 { left: 75%; transform: translate(-50%, -50%); color: #f472b6; }

.overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(4px); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
}
.hidden { display: none !important; }

input {
    padding: 10px; border-radius: 8px; border: 1px solid #475569;
    background: #1e293b; color: white; text-align: center; margin-bottom: 10px;
    font-size: 16px; width: 200px;
}

button {
    padding: 12px 28px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: white; font-weight: bold; font-size: 16px; cursor: pointer;
    transition: transform 0.1s ease;
}
button:active { transform: scale(0.95); }
</style>
</head>
<body>

<h1>AI Dance Arcade</h1>
<p style="color: #94a3b8; margin-top: 0;">Two dancers, one camera — match the YMCA moves in sync!</p>

<div id="game-container">
    <iframe id="yt-bg"
        src="https://www.youtube.com/embed/IVO3bpoOqUs?enablejsapi=1&autoplay=0&controls=0&mute=1&loop=1&playlist=IVO3bpoOqUs"
        frameborder="0" allow="autoplay">
    </iframe>

    <div id="ui-bar">
        <div class="hud-card player1" id="hud-p1">
            <div class="hud-title">Player 1 (Left)</div>
            <div class="hud-name" id="p1-name">—</div>
            <div id="score1" class="hud-value">0</div>
        </div>
        <div id="center-hud">
            <div class="hud-title">Target Move</div>
            <div id="pose-target">GET READY</div>
            <div id="timer">180s</div>
        </div>
        <div class="hud-card player2" id="hud-p2">
            <div class="hud-title">Player 2 (Right)</div>
            <div class="hud-name" id="p2-name">—</div>
            <div id="score2" class="hud-value">0</div>
        </div>
    </div>

    <div id="hit-popup-1" class="hit-popup">+10</div>
    <div id="hit-popup-2" class="hit-popup">+10</div>

    <div id="start-overlay" class="overlay">
        <h2 style="color: #ec4899; margin-bottom: 10px;">Ready to Dance?</h2>
        <input type="text" id="player1-name" placeholder="Player 1 name">
        <input type="text" id="player2-name" placeholder="Player 2 name">
        <p style="font-size: 12px; color:#94a3b8; max-width:260px; text-align:center;">
            Stand side by side — Player 1 on the left, Player 2 on the right.
        </p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="end-overlay" class="overlay hidden">
        <h2 style="color: #facc15; margin-bottom: 10px;">Stage Complete!</h2>
        <p id="final-stats" style="font-size: 16px; margin-bottom: 5px; text-align:center;"></p>
        <p id="winner-stats" style="color: #34d399; font-weight: bold; margin-bottom: 20px;"></p>
        <div id="sheet-status" style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Logging scores to Google Sheet...</div>
        <button onclick="startGame()">Play Again</button>
    </div>
</div>

<script>
const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcQZEVrNZq6uWqATZvUeCW0qkXHmFq0n5EhvwPFsjkxvEDEW__VWXtWQuvM2sFqn361Q/exec";

let video, poseNet, poses = [];
let timeLeft = 180, gameInterval = null, isGameActive = false, gameSecondsElapsed = 0;

const players = {
    1: { name: "Player 1", score: 0, lastScoreTime: 0 },
    2: { name: "Player 2", score: 0, lastScoreTime: 0 }
};

const moves = {
    "HANDS_UP": {
        label: "HANDS HIGH IN THE AIR!",
        check: (p) => p.lw.y < p.ls.y && p.rw.y < p.rs.y
    },
    "T_POSE": {
        label: "ARMS OUT (T-POSE)!",
        check: (p) => Math.abs(p.lw.y - p.ls.y) < 60 && Math.abs(p.rw.y - p.rs.y) < 60
    },
    "KNEE_LIFT": {
        label: "HIGH KNEE LIFT!",
        check: (p) => (p.lk.y < p.lh.y - 10) || (p.rk.y < p.rh.y - 10)
    },
    "SQUAT": {
        label: "DANCE SQUAT!",
        check: (p) => (p.lh.y - p.ls.y) > 80 && (p.rh.y - p.rs.y) > 80
    }
};

// Sequenced explicitly for the YMCA warm-up video structure (12-second block intervals)
function getScheduledMove(seconds) {
    let cycleTime = seconds % 24;
    if (cycleTime < 6) return moves["HANDS_UP"];
    if (cycleTime < 12) return moves["T_POSE"];
    if (cycleTime < 18) return moves["KNEE_LIFT"];
    return moves["SQUAT"];
}

function setup() {
    let canvas = createCanvas(640, 480);
    canvas.parent('game-container');
    video = createCapture(VIDEO);
    video.size(640, 480);
    video.hide();

    poseNet = ml5.poseNet(video, { detectionType: 'multiple', maxPoseDetections: 2 }, () => console.log("PoseNet Ready"));
    poseNet.on('pose', results => poses = results);
}

function getSortedPoses() {
    return poses
        .filter(p => p.pose && p.pose.keypoints)
        .slice()
        .sort((a, b) => a.pose.nose.x - b.pose.nose.x);
}

function draw() {
    clear();
    push();
    translate(width, 0);
    scale(-1, 1);
    tint(255, 120);
    image(video, 0, 0, width, height);

    if (isGameActive) {
        const sorted = getSortedPoses();
        const colors = [[52, 211, 153], [244, 114, 182]];
        for (let i = 0; i < sorted.length && i < 2; i++) {
            const kp = sorted[i].pose.keypoints;
            fill(colors[i][0], colors[i][1], colors[i][2]);
            noStroke();
            for (let k = 0; k < kp.length; k++) {
                if (kp[k].score > 0.15) {
                    ellipse(kp[k].position.x, kp[k].position.y, 10, 10);
                }
            }
        }
    }
    pop();

    if (isGameActive) {
        checkScoring();
    }
}

function extractKeypoints(pose) {
    return {
        lw: pose.leftWrist, rw: pose.rightWrist,
        ls: pose.leftShoulder, rs: pose.rightShoulder,
        lh: pose.leftHip, rh: pose.rightHip,
        lk: pose.leftKnee, rk: pose.rightKnee
    };
}

function checkScoring() {
    const activeTargetMove = getScheduledMove(gameSecondsElapsed);
    document.getElementById('pose-target').innerText = activeTargetMove.label;

    const sorted = getSortedPoses();
    for (let i = 0; i < sorted.length && i < 2; i++) {
        const playerNum = i + 1;
        const pose = sorted[i].pose;
        if (!pose.leftShoulder || !pose.rightShoulder) continue;

        const kp = extractKeypoints(pose);
        if (activeTargetMove.check(kp)) {
            const now = millis();
            const p = players[playerNum];
            if (now - p.lastScoreTime > 600) {
                p.score += 10;
                document.getElementById('score' + playerNum).innerText = p.score;
                p.lastScoreTime = now;

                const popup = document.getElementById('hit-popup-' + playerNum);
                popup.style.opacity = '1';
                setTimeout(() => { popup.style.opacity = '0'; }, 350);

                updateLeaderHighlight();
            }
        }
    }
}

function updateLeaderHighlight() {
    const hud1 = document.getElementById('hud-p1');
    const hud2 = document.getElementById('hud-p2');
    hud1.classList.remove('leader');
    hud2.classList.remove('leader');
    if (players[1].score > players[2].score) hud1.classList.add('leader');
    else if (players[2].score > players[1].score) hud2.classList.add('leader');
}

function controlYouTube(action) {
    const iframe = document.getElementById('yt-bg').contentWindow;
    const func = action === 'play' ? 'playVideo' : 'pauseVideo';
    iframe.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
}

function startGame() {
    const n1 = document.getElementById('player1-name').value.trim();
    const n2 = document.getElementById('player2-name').value.trim();
    players[1] = { name: n1 || "Player 1", score: 0, lastScoreTime: 0 };
    players[2] = { name: n2 || "Player 2", score: 0, lastScoreTime: 0 };

    document.getElementById('p1-name').innerText = players[1].name;
    document.getElementById('p2-name').innerText = players[2].name;
    document.getElementById('score1').innerText = 0;
    document.getElementById('score2').innerText = 0;
    document.getElementById('hud-p1').classList.remove('leader');
    document.getElementById('hud-p2').classList.remove('leader');

    timeLeft = 180;
    gameSecondsElapsed = 0;
    isGameActive = true;
    document.getElementById('timer').innerText = `${timeLeft}s`;
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('end-overlay').classList.add('hidden');

    controlYouTube('play');

    clearInterval(gameInterval);
    gameInterval = setInterval(() => {
        timeLeft--;
        gameSecondsElapsed++;
        document.getElementById('timer').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) endGame();
    }, 1000);
}

async function endGame() {
    clearInterval(gameInterval);
    isGameActive = false;
    controlYouTube('pause');

    const p1 = players[1], p2 = players[2];
    let winnerText = p1.score > p2.score ? `🏆 ${p1.name} wins!` : (p2.score > p1.score ? `🏆 ${p2.name} wins!` : `🤝 It's a tie!`);

    document.getElementById('final-stats').innerText = `${p1.name}: ${p1.score} pts | ${p2.name}: ${p2.score} pts`;
    document.getElementById('winner-stats').innerText = winnerText;
    document.getElementById('sheet-status').innerText = "Logging scores to Google Sheet...";
    document.getElementById('end-overlay').classList.remove('hidden');

    await sendScoresToGoogleSheet(p1, p2);
}

async function sendScoresToGoogleSheet(p1, p2) {
    const payload = {
        player1Name: p1.name, player1Score: p1.score,
        player2Name: p2.name, player2Score: p2.score,
        winner: p1.score === p2.score ? "Tie" : (p1.score > p2.score ? p1.name : p2.name)
    };
    try {
        await fetch(GOOGLE_SHEET_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        document.getElementById('sheet-status').innerText = "Scores successfully logged to Google Sheet!";
    } catch (error) {
        document.getElementById('sheet-status').innerText = "Failed to log scores to Google Sheet.";
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dance Arcade - Posture Sync</title>
    
    <!-- Direct Single-Source MediaPipe & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0f172a; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        h1 { margin: 10px 0 5px 0; font-size: 26px; color: #ec4899; }

        #game-container {
            position: relative; width: 640px; height: 480px;
            border: 4px solid #3b82f6; border-radius: 12px;
            overflow: hidden; background: #050b14;
        }

        video, canvas {
            position: absolute; top: 0; left: 0;
            width: 640px; height: 480px; transform: scaleX(-1);
        }

        #ui-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; z-index: 5; pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #475569;
            padding: 6px 14px; border-radius: 8px; text-align: center;
        }

        .hud-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .hud-value { font-size: 18px; font-weight: bold; color: #facc15; }

        #meter-bg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 16px; background: rgba(0,0,0,0.6);
            border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; z-index: 5;
        }

        #meter-fill { width: 0%; height: 100%; background: #34d399; transition: width 0.1s ease; }

        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; padding: 20px;
        }
        .hidden { display: none !important; }

        input {
            padding: 10px; border-radius: 8px; border: 1px solid #475569;
            background: #1e293b; color: white; text-align: center; margin-bottom: 15px; font-size: 16px; width: 200px;
        }

        button {
            padding: 12px 28px; border-radius: 8px; border: none;
            background: #ec4899; color: white; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        button:hover { background: #db2777; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>AI Dance Arcade - Posture Sync</h1>

    <div id="game-container">
        <!-- Webcam & Drawing Canvas -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas" width="640" height="480"></canvas>

        <div id="ui-bar">
            <div class="hud-card">
                <div class="hud-title">Score</div>
                <div id="score" class="hud-value">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Target Move</div>
                <div id="pose-name" class="hud-value" style="color: #ec4899;">HANDS UP</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Match</div>
                <div id="match-pct" class="hud-value" style="color: #34d399;">0%</div>
            </div>
        </div>

        <div id="meter-bg"><div id="meter-fill"></div></div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="overlay">
            <h2 style="color: #ec4899; margin-bottom: 5px;">Dance Routine</h2>
            <div id="status-text" style="color: #facc15; font-size: 14px; margin-bottom: 15px;">Initializing Camera & AI...</div>
            <input type="text" id="player-name" placeholder="Enter Player Name" maxlength="12">
            <button id="start-btn" onclick="forceStartGame()">Start Game</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="end-overlay" class="overlay hidden">
            <h2 style="color: #facc15; margin-bottom: 5px;">Stage Complete!</h2>
            <p id="final-stats" style="font-size: 16px; color: #38bdf8;"></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const ctx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let isGameActive = false;
        let score = 0;
        let trackedLandmarks = null;
        let poseEngine = null;

        // Force enable button immediately so user can play regardless
        document.getElementById('start-btn').disabled = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                videoElement.srcObject = stream;
                statusText.innerText = "Camera Ready! Loading AI...";
                statusText.style.color = "#34d399";
                initPoseTracking();
            } catch (err) {
                console.warn("Camera failed or denied:", err);
                statusText.innerText = "Camera access denied or missing. Game will run in simulation mode.";
                statusText.style.color = "#ef4444";
            }
        }

        function initPoseTracking() {
            if (typeof Pose === 'undefined') {
                statusText.innerText = "AI Library loading failed. Click Start to play anyway.";
                return;
            }

            try {
                poseEngine = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });

                poseEngine.setOptions({ modelComplexity: 1, smoothLandmarks: true });
                poseEngine.onResults(results => {
                    trackedLandmarks = results.poseLandmarks || null;
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (poseEngine) await poseEngine.send({ image: videoElement });
                    },
                    width: 640, height: 480
                });
                camera.start();
                statusText.innerText = "AI & Camera Online!";
            } catch (e) {
                console.error("MediaPipe initialization error:", e);
            }
        }

        function forceStartGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            isGameActive = true;
            score = 0;
            document.getElementById('score').innerText = score;
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!isGameActive) return;

            // Clear Canvas
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw Skeleton points if tracked
            if (trackedLandmarks) {
                ctx.fillStyle = '#00ffcc';
                [11, 12, 15, 16].forEach(idx => {
                    let lm = trackedLandmarks[idx];
                    if (lm) {
                        ctx.beginPath();
                        ctx.arc(lm.x * 640, lm.y * 480, 8, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                });
                
                // Demo score accumulation
                score += 1;
                document.getElementById('score').innerText = score;
                document.getElementById('match-pct').innerText = "85%";
                document.getElementById('meter-fill').style.width = "85%";
            } else {
                document.getElementById('match-pct').innerText = "0%";
                document.getElementById('meter-fill').style.width = "0%";
            }

            requestAnimationFrame(gameLoop);
        }

        // Run setup on load
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>

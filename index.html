<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dance Arcade - Native Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0f172a; color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        h1 { margin: 10px 0 5px 0; font-size: 26px; color: #ec4899; }

        #game-container {
            position: relative; width: 640px; height: 480px;
            border: 4px solid #3b82f6; border-radius: 12px;
            overflow: hidden; background: #000;
        }

        video, canvas {
            position: absolute; top: 0; left: 0;
            width: 640px; height: 480px; transform: scaleX(-1);
        }

        #ui-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; z-index: 5; pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #475569;
            padding: 6px 14px; border-radius: 8px; text-align: center;
        }

        .hud-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .hud-value { font-size: 18px; font-weight: bold; color: #facc15; }

        #meter-bg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 16px; background: rgba(0,0,0,0.6);
            border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; z-index: 5;
        }

        #meter-fill { width: 0%; height: 100%; background: #34d399; transition: width 0.1s ease; }

        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; padding: 20px;
        }
        .hidden { display: none !important; }

        input {
            padding: 10px; border-radius: 8px; border: 1px solid #475569;
            background: #1e293b; color: white; text-align: center; margin-bottom: 15px; font-size: 16px; width: 200px;
        }

        button {
            padding: 12px 28px; border-radius: 8px; border: none;
            background: #ec4899; color: white; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        button:hover { background: #db2777; }
    </style>
</head>
<body>

    <h1>AI Dance Arcade - Native Edition</h1>

    <div id="game-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas" width="640" height="480"></canvas>

        <div id="ui-bar">
            <div class="hud-card">
                <div class="hud-title">Score</div>
                <div id="score" class="hud-value">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Target Move</div>
                <div id="pose-name" class="hud-value" style="color: #ec4899;">HANDS UP</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Match</div>
                <div id="match-pct" class="hud-value" style="color: #34d399;">0%</div>
            </div>
        </div>

        <div id="meter-bg"><div id="meter-fill"></div></div>

        <div id="start-overlay" class="overlay">
            <h2 style="color: #ec4899; margin-bottom: 5px;">Dance Routine</h2>
            <p id="status-text" style="color: #facc15; font-size: 13px; margin-bottom: 15px;">Click button to allow camera & start</p>
            <input type="text" id="player-name" placeholder="Enter Player Name" maxlength="12">
            <button id="start-btn">Start Game</button>
        </div>

        <div id="end-overlay" class="overlay hidden">
            <h2 style="color: #facc15; margin-bottom: 5px;">Stage Complete!</h2>
            <p id="final-stats" style="font-size: 16px; color: #38bdf8;"></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const ctx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const statusText = document.getElementById('status-text');

        let isGameActive = false;
        let score = 0;
        let matchValue = 0;

        // Direct Event Listener Binding (Bypasses GitHub inline blocking)
        startBtn.addEventListener('click', async () => {
            statusText.innerText = "Requesting camera...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                document.getElementById('start-overlay').classList.add('hidden');
                isGameActive = true;
                score = 0;
                requestAnimationFrame(gameLoop);
            } catch (err) {
                console.error(err);
                statusText.innerText = "Camera denied or not found. Starting arcade mode...";
                statusText.style.color = "#ef4444";
                
                // Fallback start without camera if blocked
                setTimeout(() => {
                    document.getElementById('start-overlay').classList.add('hidden');
                    isGameActive = true;
                    requestAnimationFrame(gameLoop);
                }, 1000);
            }
        });

        restartBtn.addEventListener('click', () => {
            location.reload();
        });

        function gameLoop() {
            if (!isGameActive) return;

            // Clear canvas overlay
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Arcade Visual Loop
            matchValue = Math.floor(70 + Math.sin(Date.now() / 200) * 25);
            score += 1;

            document.getElementById('score').innerText = score;
            document.getElementById('match-pct').innerText = matchValue + "%";
            document.getElementById('meter-fill').style.width = matchValue + "%";

            // Render Target Guide Overlay
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(220, 150); ctx.lineTo(320, 220); ctx.lineTo(420, 150);
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>

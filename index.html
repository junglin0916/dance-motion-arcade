<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dance Arcade - ml5 PoseNet</title>
    <!-- p5.js Libraries (Matching Snake Game Stack) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.sound.min.js"></script>
    <!-- ml5.js Library -->
    <script src="https://unpkg.com/ml5@0.4.2/dist/ml5.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 28px;
            color: #ec4899;
        }

        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* YouTube Background */
        #yt-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* p5 Canvas Overlay */
        #defaultCanvas0 {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* UI Score Banner */
        #ui-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 3;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
        }

        .hud-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 22px;
            font-weight: bold;
            color: #facc15;
        }

        /* Hit Popup FX */
        #hit-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 10px #000;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            z-index: 4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>AI Dance Arcade</h1>
    <p style="color: #94a3b8; margin-top: 0;">Raise your hands above your shoulders to score points!</p>

    <div id="game-container">
        <!-- YouTube Background Video -->
        <iframe id="yt-bg" 
                src="https://www.youtube.com/embed/fJ9rUzIMcZQ?enablejsapi=1&autoplay=1&mute=1&controls=0&loop=1" 
                frameborder="0" 
                allow="autoplay">
        </iframe>

        <!-- HUD Interface -->
        <div id="ui-bar">
            <div class="hud-card">
                <div class="hud-title">Score</div>
                <div id="score" class="hud-value">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Tracking Status</div>
                <div id="status-text" class="hud-value" style="color: #34d399; font-size: 16px;">Loading Model...</div>
            </div>
        </div>

        <div id="hit-popup">PERFECT! +10</div>
    </div>

    <script>
        let video;
        let poseNet;
        let poses = [];
        let score = 0;
        let lastScoreTime = 0;

        function setup() {
            let canvas = createCanvas(640, 480);
            canvas.parent('game-container');

            // WebCam setup via p5.js
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide();

            // Initialize PoseNet with standard settings
            poseNet = ml5.poseNet(video, modelReady);
            poseNet.on('pose', function(results) {
                poses = results;
            });
        }

        function modelReady() {
            document.getElementById('status-text').innerText = "READY! RAISE HANDS";
        }

        function draw() {
            clear();

            // Render mirrored webcam feed
            push();
            translate(width, 0);
            scale(-1, 1);
            tint(255, 130);
            image(video, 0, 0, width, height);

            if (poses.length > 0) {
                let pose = poses[0].pose;

                // Draw Red Dots on Key Joints
                for (let i = 0; i < pose.keypoints.length; i++) {
                    let keypoint = pose.keypoints[i];
                    if (keypoint.score > 0.1) {
                        fill(255, 0, 100);
                        noStroke();
                        ellipse(keypoint.position.x, keypoint.position.y, 10, 10);
                    }
                }
            }
            pop();

            // Run direct position-based scoring
            checkScoring();
        }

        function checkScoring() {
            if (poses.length > 0) {
                let pose = poses[0].pose;

                // Grab wrist and shoulder points directly
                let lw = pose.leftWrist;
                let rw = pose.rightWrist;
                let ls = pose.leftShoulder;
                let rs = pose.rightShoulder;

                // If PoseNet sees shoulder points
                if (ls.confidence > 0.1 || rs.confidence > 0.1) {
                    
                    // Shoulder baseline (the higher shoulder on screen)
                    let shoulderY = min(ls.y, rs.y);

                    // Check if either wrist is above the shoulder baseline (smaller Y means higher on screen)
                    let leftHandUp = (lw.confidence > 0.15) && (lw.y < shoulderY);
                    let rightHandUp = (rw.confidence > 0.15) && (rw.y < shoulderY);

                    if (leftHandUp || rightHandUp) {
                        let now = millis();
                        if (now - lastScoreTime > 500) { // 0.5s cooldown
                            score += 10;
                            document.getElementById('score').innerText = score;
                            lastScoreTime = now;

                            // Show PERFECT feedback
                            let popup = document.getElementById('hit-popup');
                            popup.style.opacity = '1';
                            setTimeout(() => { popup.style.opacity = '0'; }, 300);
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
